<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Offline – WatchHub Luxury Horology</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }
    body {
      background: radial-gradient(circle at 50% 20%, #0d1a33 0%, #070918 70%);
      color: #F8FAFC;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      text-align: center;
    }
    .card {
      background: rgba(17, 23, 44, 0.85);
      border: 1px solid rgba(0, 207, 255, 0.25);
      box-shadow: 0 0 50px rgba(0, 207, 255, 0.15), 0 20px 40px rgba(0, 0, 0, 0.8);
      border-radius: 24px;
      padding: 40px 32px;
      max-width: 460px;
      width: 100%;
      backdrop-filter: blur(12px);
    }
    .emblem {
      width: 80px;
      height: 80px;
      border-radius: 50%;
      background: linear-gradient(135deg, rgba(0, 207, 255, 0.15), rgba(231, 180, 63, 0.15));
      border: 1px solid rgba(231, 180, 63, 0.4);
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 20px;
      font-size: 34px;
    }
    h1 {
      font-size: 22px;
      font-weight: 700;
      letter-spacing: 0.5px;
      margin-bottom: 12px;
      color: #FFFFFF;
    }
    .badge {
      display: inline-block;
      padding: 4px 12px;
      border-radius: 999px;
      background: rgba(231, 180, 63, 0.15);
      border: 1px solid rgba(231, 180, 63, 0.4);
      color: #E7B43F;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 1px;
      text-transform: uppercase;
      margin-bottom: 16px;
    }
    p {
      color: #A6B1C8;
      font-size: 13px;
      line-height: 1.6;
      margin-bottom: 28px;
    }
    .btn {
      display: inline-block;
      width: 100%;
      padding: 13px 20px;
      border-radius: 14px;
      background: linear-gradient(135deg, #00CFFF, #0099FF);
      color: #020712;
      font-size: 13px;
      font-weight: 700;
      letter-spacing: 0.5px;
      border: none;
      cursor: pointer;
      box-shadow: 0 0 25px rgba(0, 207, 255, 0.4);
      transition: all 0.2s ease;
    }
    .btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 0 35px rgba(0, 207, 255, 0.6);
    }
    .footer-note {
      font-size: 10px;
      color: #55627a;
      margin-top: 24px;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="emblem">⏳</div>
    <span class="badge">Connection Offline</span>
    <h1>Time Standstill</h1>
    <p>
      You are currently disconnected from the WatchHub network. Your session and cart data are safely secured in local cache. Please check your internet connection and retry.
    </p>
    <button class="btn" onclick="window.location.reload()">
      Reconnect &amp; Refresh
    </button>
    <div class="footer-note">
      WatchHub Luxury Horology • Secure Offline Vault
    </div>
  </div>
</body>
</html>
